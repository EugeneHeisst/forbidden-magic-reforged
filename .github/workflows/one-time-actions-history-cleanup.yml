name: One-time Actions history cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-actions-history-cleanup.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Remove generated workflow noise
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "repository-actions-history-cleanup",
          }
          keep_names = {"Java CI with Gradle", "CodeQL"}

          def api(path, method="GET"):
              req = urllib.request.Request(base + path, headers=headers, method=method)
              for attempt in range(7):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          body = response.read()
                          return json.loads(body) if body else None
                  except urllib.error.HTTPError as exc:
                      detail = exc.read().decode("utf-8", "replace")
                      if exc.code == 404 and method == "DELETE":
                          return None
                      if exc.code in (403, 429):
                          retry_after = exc.headers.get("Retry-After")
                          remaining = exc.headers.get("X-RateLimit-Remaining")
                          if retry_after:
                              delay = int(retry_after)
                          elif remaining == "0" and exc.headers.get("X-RateLimit-Reset"):
                              delay = max(1, int(exc.headers["X-RateLimit-Reset"]) - int(time.time()) + 1)
                          else:
                              delay = min(60, 5 * (attempt + 1))
                          if attempt < 6:
                              print(f"Rate-limit response; waiting {delay}s before retry.", flush=True)
                              time.sleep(delay)
                              continue
                      raise RuntimeError(f"{method} {path} failed: HTTP {exc.code}: {detail}") from exc
              raise RuntimeError(f"Retries exhausted for {method} {path}")

          runs = []
          page = 1
          while True:
              result = api(f"/actions/runs?per_page=100&page={page}")
              batch = result.get("workflow_runs", [])
              if not batch:
                  break
              runs.extend(batch)
              print(f"Collected page {page}: {len(batch)} runs (total collected: {len(runs)}).", flush=True)
              if len(batch) < 100:
                  break
              page += 1

          to_delete = [
              run for run in runs
              if run.get("id") != current_run_id
              and run.get("name") not in keep_names
              and run.get("status") == "completed"
          ]
          kept = [
              run for run in runs
              if run.get("name") in keep_names
              or run.get("id") == current_run_id
              or run.get("status") != "completed"
          ]
          print(f"Snapshot: {len(runs)} runs; preserving {len(kept)} normal/current/active runs; deleting {len(to_delete)} completed non-core runs.", flush=True)

          deleted = 0
          failures = []
          for index, run in enumerate(to_delete, 1):
              try:
                  api(f"/actions/runs/{run['id']}", method="DELETE")
                  deleted += 1
              except Exception as exc:
                  failures.append((run.get("id"), run.get("name"), str(exc)))
                  print(f"FAILED {run.get('id')} {run.get('name')}: {exc}", flush=True)
              if index % 25 == 0 or index == len(to_delete):
                  print(f"Progress: processed {index}/{len(to_delete)}; deleted {deleted}; failed {len(failures)}.", flush=True)
              time.sleep(0.9)

          summary = [
              "# Actions history cleanup",
              "",
              f"- Runs inspected: **{len(runs)}**",
              f"- Preserved core workflows (Java CI with Gradle, CodeQL) and active/current runs: **{len(kept)}**",
              f"- Completed non-core runs removed: **{deleted}**",
              f"- Deletion failures: **{len(failures)}**",
          ]
          if failures:
              summary += ["", "## Failed deletions"]
              summary += [f"- Run {rid} ({name}): {error}" for rid, name, error in failures]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary) + "\n")
          print("\n".join(summary), flush=True)
          if failures:
              raise SystemExit(1)
          PY
