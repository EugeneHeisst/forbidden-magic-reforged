name: Build and test 1.21.1
on:
  push:
    branches: ["1.21.1"]
  pull_request:
    branches: ["1.21.1"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/prepare_dependencies.py --test-pack
      - run: chmod +x gradlew
      - name: Native integration tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon -PcompatTest -PcompatPack=deps/test-pack runGameTestServer | tee gametest.log
          grep -E 'All [0-9]+ required tests passed' gametest.log
      - name: Build release without audit classes
        run: ./gradlew --no-daemon clean build
      - run: python tools/check_provenance.py
      - uses: actions/upload-artifact@v4
        with:
          name: forbidden-magic-1.21.1
          path: build/libs/*.jar
