plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "forbidden-magic"
}

sourceSets {
    client {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            sourceSet = sourceSets.client
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            // These tests use vanilla's empty structure template, so permit both the addon namespace and minecraft.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }

    maven {
        name = "Minecraft Forge"
        url = uri("https://maven.minecraftforge.net/")
        content {
            includeGroup "com.github.glitchfiend"
        }
    }

    maven {
        name = "BlameJared"
        url = uri("https://maven.blamejared.com/")
        content {
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    clientRuntimeClasspath.extendsFrom runtimeClasspath
}

def tc4Jar = providers.gradleProperty('tc4Jar').orElse(file('../thaumcraft4-modern/versions/0.17.191/tc4modern-0.17.191.jar').exists() ? '../thaumcraft4-modern/versions/0.17.191/tc4modern-0.17.191.jar' : 'deps/tc4modern-0.17.191.jar')
dependencies {
    implementation files(tc4Jar)
}

tasks.named('jar', Jar) {
    archiveFileName = "forbidden-magic-${mod_version}.jar"
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
}


def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_license: mod_license,
        mod_authors: mod_authors,
        mod_credits: mod_credits,
        mod_description: mod_description,
        thaumcraft_version: thaumcraft_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}



if (providers.gradleProperty('compatTest').isPresent()) {
    sourceSets.main.java.srcDir('tests/compat')
    def testPack = providers.gradleProperty('compatPack').get()
    dependencies { runtimeOnly fileTree(dir: testPack, include: '*.jar') }
    neoForge.runs.client.gameDirectory = file(providers.gradleProperty('compatRun').getOrElse('run-compat-client'))
    neoForge.runs.client.programArguments.addAll '--width','1100','--height','760','--quickPlaySingleplayer','Showcase'
    neoForge.runs.client.systemProperty 'forbiddenmagic.clientAudit', 'true'
    neoForge.runs.gameTestServer.systemProperty 'forbiddenmagic.fullPack', providers.gradleProperty('compatFullPack').getOrElse('true')
    neoForge.runs.gameTestServer.gameDirectory = file(providers.gradleProperty('compatRun').getOrElse('run-compat'))
}
