[forbiddenmagic.research_page.NETHERSHARDS]
1 = "Странная энергия циркулирует по Нижнему миру. Как известно, иногда они затвердевают в хрустальные осколки во время наступления определённых симпатических событий."
2 = "Эти кристаллы пронизаны различными пороками и имеют множество применений для бессовестных тауматургов.<BR>Есть семь типов осколков Нижнего мира и каждый настроен на \"Смертный грех\".<BR><BR><IMG>forbiddenmagic:textures/misc/research.png:0:0:111:16:1</IMG><BR>"
2b = "Эти кристаллы пронизаны различными пороками и имеют множество применений для бессовестных тауматургов.<BR>Есть шесть типов осколков Нижнего мира и каждый настроен на \"Смертный грех.\"<BR><BR><IMG>forbiddenmagic:textures/misc/research.png:0:16:95:16:1</IMG><BR>"
3 = "Осколки гнева кристаллизуются во время актов насилия. Чем больше используется физической силы, тем больше вероятности появления осколка гнева.<BR><BR>Осколки лени кристаллизируются, когда случайности используются для получения ресурсов.<BR><BR>Осколки жадности берутся у тех, у кого они есть и передаются тем, кто жаждет их.<BR><BR>Осколок гордости появится, когда существо с поистине великой силой будет поставлено на место.<BR><BR>Осколки прожорливости кристаллизируются, когда кто-то пирует.<BR><BR>Осколки жадности появляются, когда зачарования используется для получения выгоды."

[forbiddenmagic.research_page.HELLFIRE]
1 = "Остаться пустым в Нижнем мире - худшее, что может произойти. Вы преодолеваете все трудности в поисках чего-то, что Вам нужно, но прежде чем Вы вернётесь домой, какой-нибудь глупый гаст решает поплакать, разрушив при этом Ваш портал. Конечно, эта проблема может быть решена, если у Вас есть огниво, но кто носит с собой огниво?<BR><BR>Вы обнаружили способ использования Вис в Вашем жезле для зажигания огня на некоторых материалах.  Нажмите ПКМ жезлом без набалдашника по камню Нижнего мира или обсидиану, чтобы зажечь огонь, используя Ignis из жезла."

[forbiddenmagic.research_page.SKULLAXE]
1 = "Некоторые монстры, ну просто выводят Вас из себя! Например, скелеты! Они всегда используют Вас в качестве мишени. Или криперы! Они всегда ходят рядом и взрывают всё вокруг! Вы хотите отрубить им их самодовольные головы и воткнуть их на копья.<BR><BR>К счастью, Вы обнаружили предмет, который позволит Вам сделать это.  При убийстве монстра топором собирателя черепов, есть шанс, что Вы отрубите ему голову. Можно также отрубить головы игрокам! К сожалению, наполнение делает топор слишком кровожадным, что не позволяет эффективно рубить деревья."

