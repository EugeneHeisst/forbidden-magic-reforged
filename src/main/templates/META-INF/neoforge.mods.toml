modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="${mod_credits}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tc4modern"
    type="required"
    versionRange="[${thaumcraft_version},)"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
config="forbiddenmagic.mixins.json"

[[dependencies.${mod_id}]]
    modId="thaumcraft"
    type="incompatible"
    reason="This fork requires EugeneHeisst Thaumcraft UNOFFICIAL PORT (tc4modern)."
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ttinkerer"
    type="optional"
    versionRange="[0.1.11,)"
    ordering="AFTER"
    side="BOTH"
